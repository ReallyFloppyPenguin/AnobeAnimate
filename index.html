<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnobeAnimate</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      /* Loading screen shown until React replaces #root's contents. */
      html, body { margin: 0; background: #09090b; }
      .boot { height: 100vh; display: grid; place-items: center; }
      .boot .spin { transform-origin: 50px 50px; animation: boot-spin 1.4s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot .spin { animation-duration: 4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading AnobeAnimate">
        <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#c4baff" />
              <stop offset="1" stop-color="#8b7cf6" />
            </linearGradient>
          </defs>
          <path class="spin" d="M50 16 L84 50 L50 84 L16 50 Z" fill="url(#boot-g)" stroke="url(#boot-g)" stroke-width="6" stroke-linejoin="round" />
          <path d="M44 38 L62 50 L44 62 Z" fill="#0c0c12" stroke="#0c0c12" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
